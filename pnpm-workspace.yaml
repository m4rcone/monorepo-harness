packages:
  - "apps/*"
  - "packages/*" # libs compartilhadas futuras

# Supply chain. minimumReleaseAge, blockExoticSubdeps e strictDepBuilds já são padrão no pnpm 11:
# ficam explícitos para documentar a política e não depender do default
minimumReleaseAge: 1440 # só instala versões publicadas há pelo menos 24h
trustPolicy: no-downgrade # falha se uma versão nova perde a provenance da anterior
trustPolicyExclude: # exceções: versão sem provenance, revise antes de incluir
  - why-is-node-running@3.2.2 # dependência do vitest
blockExoticSubdeps: true # dependência transitiva não pode vir de git/tarball
strictDepBuilds: true # script de build não aprovado falha o install (`pnpm approve-builds` grava abaixo)
allowBuilds: # scripts de build revisados: true = roda, false = recusado
  esbuild: false # postinstall só confere o binário, que vem da dependência opcional da plataforma

# node_modules desatualizado falha na hora com "Run pnpm install", em vez de instalar sozinho (o
# default do pnpm 11 é `install`): install pede aprovação no .claude/settings.json, mas `pnpm run *`
# e `pnpm vitest|tsc|eslint|prettier *` não
verifyDepsBeforeRun: error
