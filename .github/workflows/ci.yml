# CI determinístico: lint, formatação, hooks, typecheck, testes e build (`pnpm run check`).
# ESTE workflow é o gate de merge: exija o check `checks` num ruleset da `main` (README, "Proteja a `main`").
# Os workflows com Claude (claude.yml, claude-code-review.yml) são advisory e nunca bloqueiam.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o CI só lê o repositório
permissions:
  contents: read

# Push novo num PR cancela a execução anterior; na main, todo commit mantém seu resultado
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nada aqui faz push: sem o GITHUB_TOKEN no .git/config, código de dependência ou de teste
          # não tem como lê-lo
          persist-credentials: false

      # Lê a versão do pnpm do campo "packageManager" do package.json raiz
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Mudou dependência? Comite o pnpm-lock.yaml junto
      - run: pnpm install --frozen-lockfile

      # Os mesmos passos que o dev e a skill `pr` rodam localmente
      - run: pnpm run check
