# Revisão automática de PR com Claude — ADVISORY (comenta, não bloqueia merge).
#
# Setup (uma vez): rode `/install-github-app` num terminal com Claude Code, ou
# instale https://github.com/apps/claude manualmente e adicione o secret
# ANTHROPIC_API_KEY em Settings → Secrets and variables → Actions.
#
# Controles de custo (teto triplo): --max-turns + timeout-minutes + concurrency.
# Modelo FIXADO pelo nome completo (aliases mudam com o tempo e quebram
# reprodutibilidade de custo em CI).
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    # Não gastar tokens com PRs que só tocam docs/config:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"

# Um review por PR por vez; push novo cancela o anterior
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # postar o comentário de review
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # teto duro contra jobs fugitivos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o review precisa do diff completo contra a base

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # NUNCA hardcode
          prompt: |
            Revise o diff deste PR contra o CLAUDE.md e as rules do repositório.
            Reporte APENAS: bugs prováveis, problemas de segurança e violações
            das convenções documentadas. Nada de estilo (o lint cuida disso).
            Organize por prioridade (crítico/aviso/sugestão) com arquivo:linha.
            Se não houver achados, diga isso em uma linha.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 8
